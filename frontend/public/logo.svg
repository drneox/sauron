<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sweep" x1="24" y1="24" x2="34" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="iris-clip">
      <circle cx="24" cy="24" r="9.5"/>
    </clipPath>
  </defs>
  <!-- eyelashes = radar ticks -->
  <path d="M24 4v4M10 8l2.5 3.5M38 8l-2.5 3.5" stroke="#c084fc" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
  <!-- eye outline -->
  <path d="M3 24 Q24 7 45 24 Q24 41 3 24 Z" stroke="#c084fc" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round"/>
  <!-- iris = radar rings -->
  <circle cx="24" cy="24" r="9.5" stroke="#c084fc" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="5.5" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- rotating sweep inside the iris -->
  <g clip-path="url(#iris-clip)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="3.5s" repeatCount="indefinite"/>
      <path d="M24 24 L33 15.5 A9.5 9.5 0 0 0 24 14.5 Z" fill="url(#sweep)"/>
      <line x1="24" y1="24" x2="33" y2="15.5" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
  <!-- pupil: Chainguard-style mint accent -->
  <circle cx="24" cy="24" r="2.6" fill="#34d399"/>
</svg>
