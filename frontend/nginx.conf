# Trusted peers allowed to supply the real client IP via CF-Connecting-IP:
# loopback (host-side cloudflared tunnel) and the docker bridge networks.
# Any other peer (LAN/Internet clients hitting nginx directly) gets the
# header overwritten with its real address, so it cannot spoof the edge
# gate's whitelist decision downstream.
geo $trusted_gateway {
    default 0;
    127.0.0.0/8 1;
    ::1 1;
    172.16.0.0/12 1;
}

map $trusted_gateway $edge_client_ip {
    1       $http_cf_connecting_ip;
    default $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached — it points to the hashed bundles
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Hashed assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback (HTML responses never cached)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # API → backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Always overwritten — never passed verbatim from the client.
        proxy_set_header CF-Connecting-IP $edge_client_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header CF-Connecting-IP $edge_client_ip;
        proxy_set_header X-Forwarded-For "";
    }
}
